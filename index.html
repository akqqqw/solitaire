<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b241b" />
    <meta name="description" content="Пасьянс Клуб — Косынка, Паук, Свободная ячейка и Пирамида в одном красивом приложении." />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Пасьянс Клуб</title>
    <!-- SDK Яндекс Игр: /sdk.js — для загрузки через консоль разработчика,
         запасной абсолютный адрес — для собственного домена. -->
    <script
      src="/sdk.js"
      async
      onload="window.__yaSdkLoaded = true"
      onerror="(function () {
        var s = document.createElement('script');
        s.src = 'https://sdk.games.s3.yandex.net/sdk.js';
        s.async = true;
        s.onload = function () { window.__yaSdkLoaded = true; };
        s.onerror = function () { window.__yaSdkFailed = true; };
        document.head.appendChild(s);
      })()"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
